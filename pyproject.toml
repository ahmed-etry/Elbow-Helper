[project]
name = "elbow-helper"
version = "0.1.0"
description = "The Discord bot built for the Brown Elbow Clash of Clans community."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp~=3.13.3",
  "chat-exporter~=3.0.1",
  "discord.py~=2.6.4",
  "emoji~=2.15.0",
  "google-api-python-client~=2.190.0",
  "google-auth~=2.48.0",
  "matplotlib~=3.10.8",
  "openai~=2.20.0",
  "python-dateutil~=2.9.0.post0",
  "python-dotenv~=1.2.1",
]

[tool.uv]
package = false
